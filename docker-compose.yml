# Development setup: PostgreSQL + Rails API + React (Vite).
# Start with: docker compose up --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: acme_salary
      POSTGRES_PASSWORD: acme_salary_dev   # development only; never reuse
      POSTGRES_DB: acme_salary_development
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"   # 5433 so it does not clash with a local PostgreSQL on 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acme_salary -d acme_salary_development"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      RAILS_ENV: development
      DB_HOST: db
      DB_USER: acme_salary
      DB_PASSWORD: acme_salary_dev
    volumes:
      - ./backend:/app
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      API_PROXY_TARGET: http://backend:3000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db_data:
  frontend_node_modules:
